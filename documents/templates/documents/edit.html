<h1>Edit Document</h1>
{% if error %}
  <p style="color:red">{{ error }}</p>
{% endif %}

<form method="post">
  {% csrf_token %}
  <label>Title:</label><br>
  <input type="text" name="title" value="{{ document.title }}" required><br><br>

  <label>Content:</label><br>
  <textarea name="content" rows="6" cols="40" required>{{ document.content }}</textarea><br><br>

  <button type="submit">Save Changes</button>
</form>

<a href="{% url 'document_detail' document.id %}">Back to Document</a>
