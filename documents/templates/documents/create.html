<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Create New Document | Snovasys Secure Docs</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 40px auto;
            padding: 0 20px;
            background-color: #f9f9f9;
        }
        h1 {
            text-align: center;
            color: #333;
        }
        form {
            background: white;
            padding: 20px;
            border-radius: 6px;
            box-shadow: 0 0 5px rgb(0 0 0 / 0.1);
        }
        label {
            display: block;
            font-weight: bold;
            margin-bottom: 6px;
            margin-top: 12px;
            color: #555;
        }
        input[type="text"],
        textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 14px;
            resize: vertical;
        }
        textarea {
            min-height: 120px;
        }
        .buttons {
            margin-top: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        button {
            background-color: #0066cc;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background-color: #004a99;
        }
        a.back-link {
            text-decoration: none;
            color: #0066cc;
            font-size: 14px;
        }
        a.back-link:hover {
            text-decoration: underline;
        }
        .error-message {
            color: red;
            font-weight: bold;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <h1>Create New Document</h1>

    {% if error %}
        <p class="error-message">{{ error }}</p>
    {% endif %}

    <form method="post" novalidate>
        {% csrf_token %}

        <label for="title">Title:</label>
        <input
            type="text"
            id="title"
            name="title"
            placeholder="Enter document title"
            required
            value="{{ request.POST.title|default_if_none:'' }}"
        />

        <label for="content">Content:</label>
        <textarea
            id="content"
            name="content"
            placeholder="Enter the content of your document"
            required
        >{{ request.POST.content|default_if_none:'' }}</textarea>

        <div class="buttons">
            <button type="submit">Create</button>
            <a href="{% url 'my_documents' %}" class="back-link">Back to My Documents</a>
        </div>
    </form>
</body>
</html>
